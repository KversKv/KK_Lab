[project]
name = "kk-lab"
dynamic = ["dependencies", "version"]
description = "KK Lab - BES芯片功耗测试工具"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
]

[project.scripts]
kk-lab = "main:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "version", "log_config", "debug_config", "resource_path"]

[tool.setuptools.packages.find]
include = ["chips*", "core*", "instruments*", "lib*", "ui*"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
version = {attr = "version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--strict-config --strict-markers"
markers = [
    "unit: 无需 Qt 的自动逻辑测试",
    "qt: 需要 QT_QPA_PLATFORM=offscreen 的自动 Qt 测试",
]

[tool.ruff]
target-version = "py312"
exclude = [".venv", "build", "dist", "Results", "Temp", "Temp_Docs"]

[tool.ruff.lint]
select = ["E9", "F63", "F7"]

[tool.mypy]
python_version = "3.12"
files = ["core/module_test/result_model.py", "core/module_test/param_spec.py"]
follow_imports = "skip"
ignore_missing_imports = true
warn_unused_configs = true
