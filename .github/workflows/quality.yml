name: quality

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check .
      - name: Mypy
        run: python -m mypy
      - name: Non-Qt tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          python -m pytest -m "not qt" --junitxml=test-results/unit-results.xml
      - name: Offscreen Qt tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -m qt --junitxml=test-results/qt-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: test-results/*.xml
          if-no-files-found: warn
