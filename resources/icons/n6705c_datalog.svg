<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Anodized Instrument Chassis Background -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111C24"/>
      <stop offset="100%" stop-color="#070C10"/>
    </linearGradient>
    <!-- Metallic Rim Bevel -->
    <linearGradient id="rimGrad" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#244254"/>
      <stop offset="50%" stop-color="#101E26"/>
      <stop offset="100%" stop-color="#07090D"/>
    </linearGradient>
    <!-- Primary Waveform Gradient -->
    <linearGradient id="waveGrad" x1="20" y1="40" x2="236" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10F59B"/>
      <stop offset="45%" stop-color="#8AFBD0"/>
      <stop offset="100%" stop-color="#10F59B"/>
    </linearGradient>
    <!-- Area Under Curve Integration Fill (Q = ∫I dt) -->
    <linearGradient id="areaFill" x1="0" y1="45" x2="0" y2="215" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10F59B" stop-opacity="0.42"/>
      <stop offset="75%" stop-color="#10F59B" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#10F59B" stop-opacity="0.0"/>
    </linearGradient>
    <!-- Keysight Red Ribbon / Trigger Gradient -->
    <linearGradient id="accentGrad" x1="0" y1="20" x2="220" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <!-- Ambient Center Glow -->
    <radialGradient id="ambientGlow" cx="118" cy="115" r="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10F59B" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer Titanium Squircle Chassis -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="5"/>
  <rect x="11" y="11" width="234" height="234" rx="49" fill="url(#ambientGlow)"/>
  <!-- Subtle Instrument Graticule Grid -->
  <g stroke="#263248" stroke-width="1.5" opacity="0.45">
    <line x1="24" y1="76" x2="232" y2="76" stroke-dasharray="4 6"/>
    <line x1="24" y1="128" x2="232" y2="128" stroke-dasharray="4 6"/>
    <line x1="24" y1="180" x2="232" y2="180" stroke-dasharray="4 6"/>
    <line x1="76" y1="28" x2="76" y2="228" stroke-dasharray="4 6"/>
    <line x1="128" y1="28" x2="128" y2="228" stroke-dasharray="4 6"/>
    <line x1="180" y1="28" x2="180" y2="228" stroke-dasharray="4 6"/>
  </g>
  <!-- Top Keysight Instrument Accent Bar -->
  <path d="M 76 10.5 L 180 10.5" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  <path d="M 24 176 L 56 176 L 68 140 L 86 190 L 114 46 L 146 154 L 166 112 L 230 112 L 230 212 L 24 212 Z" fill="url(#areaFill)"/>

  <!-- Keysight Crimson Trigger Marker Line (M1) -->
  <line x1="114" y1="24" x2="114" y2="226" stroke="#38BDF8" stroke-width="5" stroke-dasharray="10 7" stroke-linecap="round"/>
  <!-- Top & Bottom Trigger Triangles -->
  <polygon points="103,20 125,20 114,35" fill="#38BDF8"/>
  <polygon points="103,234 125,234 114,219" fill="#38BDF8"/>
  <!-- Main CH1 Current Pulse Waveform -->
  <path d="M 24 176 L 56 176 L 68 140 L 86 190 L 114 46 L 146 154 L 166 112 L 230 112" fill="none" stroke="url(#waveGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>

  <!-- Peak Current Capture Node -->
  <circle cx="114" cy="46" r="10" fill="#38BDF8" stroke="#FFFFFF" stroke-width="4.5"/></svg>
