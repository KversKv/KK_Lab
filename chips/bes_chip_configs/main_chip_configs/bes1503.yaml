voltage_low:
- // 示例:降低所有电压轨
- WRITE_BITS 0x0130 10 10 0x1
- WRITE_BITS 0x0140 10 10 0x1
- WRITE_BITS 0x0150 10 10 0x1
voltage_default:
- // 示例:恢复默认电压
- WRITE_BITS 0x0130 10 10 0x0
- WRITE_BITS 0x0140 10 10 0x0
- WRITE_BITS 0x0150 10 10 0x0
Vcore: []
VcoreM: []
VcoreL: []
VANA: []
VHPPA: []
vbat_pre_test:
  enabled: false
  commands: []
power_pre_distribution:
  enabled: false
  commands:
  - 'vcore_split&low_vol:'
  - '- WRITE 0x00d7 0x0000'
  - '- WRITE 0x011c 0x000f'
  - '- WRITE 0x011d 0x000f'
  - '- WRITE 0x011d 0x0f0f'
  - '- WRITE 0x0131 0x0102'
  - '- WRITE 0x011b 0x01ff'
  - '- WRITE 0x0132 0x300f'
  - '- WRITE 0x0133 0x160f'
  - '- WRITE 0x0134 0x160f'
  - '- WRITE 0x0132 0x300f'
